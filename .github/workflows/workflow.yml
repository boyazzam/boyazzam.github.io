name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A29BEF: ${{ secrets.A29BEF }}
          B258EE: ${{ secrets.B258EE }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A29BEF', '')
          sec_b = os.environ.get('B258EE', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 0e547f2404915c031efc010e4d34 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 09ba31d2abdaef36eef44dc0b9654c2ed0fe0d7ee7e736 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
